# Supabase's free plan pauses a project after about a week with no database
# activity. Reading one published report a day keeps it awake. Uses the public
# anon key only (the same one the website ships to browsers).
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 * * *" # every day at 06:17 UTC
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one published report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Add SUPABASE_URL and SUPABASE_ANON_KEY under Settings > Secrets and variables > Actions."
            exit 1
          fi

          status=$(curl -sS -o response.json -w "%{http_code}" --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/intelligence_reports?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")

          echo "Supabase answered with HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase did not answer normally (HTTP $status). It may be paused: check the Supabase dashboard."
            cat response.json
            exit 1
          fi
